name: build
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compilar e testar
        shell: bash
        run: |
          mkdir -p logs
          dotnet build FolhasCipo.sln -c Release > logs/build.log 2>&1 || echo "BUILD PRINCIPAL FALHOU" >> logs/build.log
          dotnet build FolhasCipo.Diag/FolhasCipo.Diag.csproj -c Release >> logs/build.log 2>&1 || echo "BUILD DIAG FALHOU" >> logs/build.log
          dotnet run --no-build --project FolhasCipo.Diag/FolhasCipo.Diag.csproj -c Release > logs/diag.log 2>&1 || echo "DIAG FALHOU (codigo $?)" >> logs/diag.log
      - name: Publicar logs na branch logs
        if: always()
        shell: bash
        run: |
          git config user.name "actions"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan logs
          git rm -rf . > /dev/null 2>&1 || true
          git add -f logs
          git commit -m "logs do build $GITHUB_SHA"
          git push -f origin logs
